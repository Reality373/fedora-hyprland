# =============================================================================
# WINDOW RULES
# =============================================================================

# GUI helpers float, centred and reasonably sized.
windowrule = float 1, match:class ^(pavucontrol|blueman-manager|nm-connection-editor|wdisplays)$
windowrule = size 900 600, match:class ^(pavucontrol|blueman-manager|nm-connection-editor|wdisplays)$
windowrule = center 1, match:class ^(pavucontrol|blueman-manager|nm-connection-editor|wdisplays)$

windowrule = float 1, match:class ^(org.gnome.Calculator|org.gnome.Settings)$
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$

# Never let a lock or auth prompt be blurred out or ignored.
windowrule = no_blur 1, match:class ^(hyprlock)$
layerrule = no_anim 1, match:namespace hyprpicker

# Do not idle-lock during fullscreen video or games.
windowrule = idle_inhibit fullscreen, match:class .*
