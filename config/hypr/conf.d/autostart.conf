# =============================================================================
# AUTOSTART
# exec-once ONLY. Never ~/.config/autostart and never systemd user units —
# either would also launch these under GNOME.
# =============================================================================

# Primary Desktop Shell: end4-pC (Quickshell)
exec-once = qs -c end4-pC

# Fallbacks if Quickshell is stopped
# exec-once = waybar
# exec-once = mako
# exec-once = hyprpaper

exec-once = hypridle

# Graphical authentication prompts (mounting disks, privileged settings).
exec-once = /usr/libexec/hyprpolkitagent

# Clipboard history: watch both text and images.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Tray applets — the GUI fallback path for network, bluetooth, and media.
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie --tray

# Match GTK cursor between Hyprland and GNOME.
exec-once = hyprctl setcursor Adwaita 24
