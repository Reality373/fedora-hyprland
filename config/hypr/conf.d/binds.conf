# =============================================================================
# KEYBINDINGS — keyboard-first, with mouse equivalents kept intact.
# Press SUPER + / for a live cheatsheet generated from this file.
# =============================================================================

$mainMod = SUPER
$terminal = ghostty
$menu = rofi -show drun
$browser = firefox

# --- Applications (optimized for 75% keyboard) ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, SPACE, global, quickshell:searchToggle
bind = $mainMod, D, global, quickshell:searchToggle
bind = $mainMod SHIFT, D, exec, rofi -show drun
bind = $mainMod, E, exec, nautilus
bind = $mainMod, C, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, M, exit,
bind = $mainMod, SLASH, exec, hypr-cheatsheet

# --- end4-pC Shell Navigation ---
bindr = $mainMod, SUPER_L, global, quickshell:searchToggle       # Tap Super = App Launcher & Search
bind  = $mainMod, TAB, global, quickshell:overviewWorkspacesToggle # Super+Tab = Visual Workspace Overview
bind  = $mainMod, ESCAPE, global, quickshell:settingsToggle      # Super+Esc = Settings Panel
bind  = $mainMod, COMMA, global, quickshell:settingsToggle       # Super+,   = Settings Panel
bind  = $mainMod, N, global, quickshell:sidebarRightToggle        # Super+N   = Notification Center & Quick Toggles
bind  = $mainMod, A, global, quickshell:sidebarLeftToggle         # Super+A   = Left Sidebar (AI / Tools)
bind  = $mainMod, X, global, quickshell:sessionToggle             # Super+X   = Session & Power Menu
bind  = $mainMod, W, global, quickshell:wallpaperSelectorToggle  # Super+W   = Wallpaper Selector
bind  = $mainMod SHIFT, W, global, quickshell:wallpaperSelectorRandom # Super+Shift+W = Random Wallpaper

# --- Window Navigation & Switching ---
bind  = ALT, TAB, cyclenext,
bind  = ALT, TAB, bringactivetotop,
bind  = ALT SHIFT, TAB, cyclenext, prev
bind  = ALT SHIFT, TAB, bringactivetotop,
bind = $mainMod CTRL, L, exec, hyprlock

# --- Focus (vim keys) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Focus (arrows) ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# --- Swap windows ---
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# --- Window switcher: jump anywhere by typing a title ---
bind = $mainMod, O, exec, rofi -show window

# --- Workspaces 1-10 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, BACKSPACE, workspace, previous
bind = $mainMod, GRAVE, togglespecialworkspace, scratch
bind = $mainMod SHIFT, GRAVE, movetoworkspace, special:scratch

# --- Modal submaps (defined in submaps.conf) ---
bind = $mainMod, R, submap, resize
bind = $mainMod, G, submap, move

# --- Utilities & System Menus (75% keyboard friendly) ---
bind = $mainMod SHIFT, N, exec, hypr-wifi
bind = $mainMod SHIFT, B, exec, hypr-bluetooth
bind = $mainMod, P, exec, hypr-power
bind = $mainMod SHIFT, V, exec, hypr-clipboard
bind = $mainMod SHIFT, A, exec, pavucontrol
bind = $mainMod SHIFT, M, exec, wdisplays
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# --- Screenshots (No PrintScreen key required — 100% on the 'S' key) ---
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard"
bind = $mainMod SHIFT, S, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"
bind = $mainMod ALT, S, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Saved to Pictures/Screenshots"
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | swappy -f -

# --- Media / volume / brightness ---
# bindel repeats while held; bindl works even when locked.
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute,        exec, pamixer -t
bindl  = , XF86AudioMicMute,     exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Direct 75% keyboard volume fallbacks (Super + '-' and Super + '=')
bindel = $mainMod, equal, exec, pamixer -i 5
bindel = $mainMod, minus, exec, pamixer -d 5
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# --- Lid close locks the laptop ---
bindl = , switch:on:Lid Switch, exec, hyprlock

# --- Mouse: drag to move, drag to resize, scroll to switch workspace ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
