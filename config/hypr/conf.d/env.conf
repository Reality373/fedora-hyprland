# --- GPU: composite on the AMD iGPU that owns eDP-1 and HDMI-A-1 ---
# AQ_DRM_DEVICES intentionally NOT set. Aquamarine parses it as a
# colon-separated device list, which breaks on any /dev/dri/by-path/
# symlink because PCI bus IDs (e.g. pci-0000:06:00.0-card) contain
# colons themselves - confirmed via a direct TTY test (2026-09-04):
# the value got torn into 3 garbage fragments and Aquamarine aborted
# with "Found no gpus to use, cannot continue" -> CBackend::create()
# crash. The same test log showed NVIDIA's card0 does not support KMS
# on this system and is auto-skipped, leaving AMD's card1 as the only
# usable device - so unset, Aquamarine's own auto-detection already
# lands on the right GPU without an explicit (and broken) override.
env = LIBVA_DRIVER_NAME,radeonsi
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = PATH,/home/reality/.local/bin:/usr/local/bin:/usr/bin:/bin:/var/lib/snapd/snap/bin
