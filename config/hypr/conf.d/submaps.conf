# =============================================================================
# SUBMAPS — modal keybindings.
# Entered from binds.conf; every submap exits on Escape, Return, or SUPER+SHIFT+entry-key.
# Modes exist so repeated operations do not need a chord held down, and so
# the bind namespace is not exhausted by ever-longer combinations.
# =============================================================================

# --- RESIZE MODE: SUPER + R, then hjkl/arrows to resize ---
submap = resize
binde = , H, resizeactive, -40 0
binde = , L, resizeactive, 40 0
binde = , K, resizeactive, 0 -40
binde = , J, resizeactive, 0 40
binde = , Left,  resizeactive, -40 0
binde = , Right, resizeactive, 40 0
binde = , Up,    resizeactive, 0 -40
binde = , Down,  resizeactive, 0 40
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = SUPER SHIFT, R, submap, reset
submap = reset

# --- MOVE MODE: SUPER + G, then hjkl to throw the window around ---
submap = move
binde = , H, moveactive, -60 0
binde = , L, moveactive, 60 0
binde = , K, moveactive, 0 -60
binde = , J, moveactive, 0 60
bind = , 1, movetoworkspace, 1
bind = , 2, movetoworkspace, 2
bind = , 3, movetoworkspace, 3
bind = , 4, movetoworkspace, 4
bind = , 5, movetoworkspace, 5
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = SUPER SHIFT, G, submap, reset
submap = reset
