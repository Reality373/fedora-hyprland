# =============================================================================
# INPUT — keyboard, touchpad, mouse
# =============================================================================

input {
    kb_layout = us
    # Caps Lock becomes a second Escape: less pinky travel for modal work.
    kb_options = caps:escape

    # Fast repeat matters for hjkl navigation.
    repeat_rate = 40
    repeat_delay = 300

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        drag_lock = true
        scroll_factor = 0.8
    }
}

# Three-finger horizontal swipe changes workspaces.
# NOTE: Hyprland 0.51+ replaced `gestures:workspace_swipe` with this keyword.
# Verified accepted by Hyprland 0.56.2 via `hyprctl keyword`.
gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_direction_lock = true
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

misc {
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    vfr = true          # save power by not redrawing a static screen
}
